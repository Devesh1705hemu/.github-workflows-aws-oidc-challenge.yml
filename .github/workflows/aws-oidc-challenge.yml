name: AWS OIDC Challenge
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
         script: |
          const token = await core.getIDToken('sts.amazonaws.com');
          const payload = JSON.parse(
            Buffer.from(token.split('.')[1], 'base64url').toString()
          );

          console.log('OIDC subject:', payload.sub);
          console.log('OIDC audience:', payload.aud);
          console.log('OIDC repository:', payload.repository);
          console.log('OIDC ref:', payload.ref);
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::221429122717:role/github-oidc-challenge-role
          aws-region: ap-south-1
      - run: aws sts get-caller-identity
      - run: aws s3 ls
